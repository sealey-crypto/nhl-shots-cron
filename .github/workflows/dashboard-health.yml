name: NHL dashboard health check
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nhl-dashboard-health
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify public dashboard and research snapshot
        run: python dashboard/health_check.py
